<main class="container my-10" th:fragment="main">
    <div class="max-w-2xl mx-auto px-4 py-16 text-center">
        <div class="w-24 h-24 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-8">
            <svg class="w-12 h-12 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </div>
        <h1 class="text-3xl font-bold text-gray-800 mb-4">Thanh toán thất bại</h1>
        <p class="text-gray-600 mb-8" th:text="${message}">Đã xảy ra lỗi trong quá trình thanh toán. Vui lòng thử lại!</p>
        <a th:href="@{/}" class="inline-flex items-center justify-center px-8 py-3 bg-orange-500 hover:bg-orange-600 text-white font-semibold rounded-lg transition">
            Về trang chủ
        </a>
    </div>
</main>
