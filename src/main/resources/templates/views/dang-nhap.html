<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập Tài Khoản - C9 Cinema</title>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
    .input-field:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }
    .btn-primary {
      background: linear-gradient(135deg, #f59e0b, #d97706);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #d97706, #b45309);
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen py-8">

  <div class="container mx-auto px-4">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden relative">
      
      <!-- Close button (like in the design) -->
      <button class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full text-gray-500 hover:bg-gray-200 transition">
        <i class="fa-solid fa-xmark"></i>
      </button>
      
      <!-- Header Image -->
      <div class="bg-gradient-to-r from-blue-50 to-orange-50 p-6 pt-12">
        <div class="flex justify-center">
          <div class="relative">
            <div class="w-48 h-36 bg-white/50 rounded-full flex items-center justify-center">
              <i class="fa-solid fa-otter text-6xl text-orange-400"></i>
              <i class="fa-solid fa-hat-cowboy text-4xl text-blue-600 absolute -top-2 right-2"></i>
              <i class="fa-solid fa-cloud text-8xl text-blue-100 absolute -z-10"></i>
            </div>
          </div>
        </div>
        <h1 class="text-2xl font-bold text-center mt-4 text-gray-800">Đăng Nhập Tài Khoản</h1>
      </div>

      <!-- Form -->
      <div class="p-6">
        <!-- Thông báo thành công -->
        <div th:if="${param.success != null}" class="mb-4 p-3 bg-green-100 text-green-700 rounded-lg text-sm">
          Đăng ký thành công! Vui lòng đăng nhập.
        </div>
        <!-- Thông báo lỗi -->
        <div th:if="${error != null}" class="mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm" th:text="${error}"></div>
        <!-- Thông báo đăng xuất -->
        <div th:if="${message != null}" class="mb-4 p-3 bg-blue-100 text-blue-700 rounded-lg text-sm" th:text="${message}"></div>
        <form th:action="@{/dang-nhap}" method="post" class="space-y-4">
          
          <!-- Email -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" name="email" required
                   class="w-full px-4 py-3 border border-gray-300 rounded-lg input-field focus:outline-none transition"
                   placeholder="Nhập Email">
          </div>

          <!-- Mật khẩu -->
          <div class="relative">
            <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
            <input type="password" name="password" id="password" required
                   class="w-full px-4 py-3 pr-10 border border-gray-300 rounded-lg input-field focus:outline-none transition"
                   placeholder="Nhập Mật khẩu">
            <button type="button" onclick="togglePassword('password', this)"
                    class="absolute right-3 top-10 text-gray-400 hover:text-gray-600">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>

          <!-- Nút đăng nhập -->
          <button type="submit"
                  class="w-full btn-primary text-white font-semibold py-4 rounded-lg hover:shadow-lg transition mt-4">
            ĐĂNG NHẬP
          </button>

        </form>

        <!-- Quên mật khẩu -->
        <div class="mt-4 text-left">
          <a href="#" class="text-gray-600 hover:text-orange-500">Quên mật khẩu?</a>
        </div>

        <!-- Link đăng ký -->
        <div class="mt-6 pt-6 border-t border-gray-200 text-center">
          <p class="text-gray-600">Bạn chưa có tài khoản?</p>
          <a th:href="@{/dang-ky}" class="inline-block w-full mt-2 py-3 border-2 border-orange-500 text-orange-500 font-semibold rounded-lg hover:bg-orange-50 transition">
            Đăng ký
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    function togglePassword(inputId, button) {
      const input = document.getElementById(inputId);
      const icon = button.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }
  </script>
</body>
</html>
