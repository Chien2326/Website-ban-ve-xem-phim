<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký Tài Khoản - C9 Cinema</title>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
    .input-field:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }
    .btn-primary {
      background: linear-gradient(135deg, #f59e0b, #d97706);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #d97706, #b45309);
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen py-8">

  <div class="container mx-auto px-4">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
      
      <!-- Header Image -->
      <div class="bg-gradient-to-r from-orange-100 to-pink-100 p-6">
        <div class="flex justify-center">
          <div class="relative">
            <div class="w-48 h-32 bg-white/50 rounded-full flex items-center justify-center">
              <i class="fa-solid fa-otter text-6xl text-orange-400"></i>
              <i class="fa-solid fa-hat-cowboy text-4xl text-blue-600 absolute -top-2 right-2"></i>
            </div>
          </div>
        </div>
        <h1 class="text-2xl font-bold text-center mt-4 text-gray-800">Đăng Ký Tài Khoản</h1>
      </div>

      <!-- Form -->
      <div class="p-6">
        <form th:action="@{/dang-ky}" method="post" th:object="${registerRequest}" class="space-y-4">
          
            <!-- Họ và tên -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Họ và tên</label>
                <input type="text" th:field="*{fullName}" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg input-field focus:outline-none transition"
                        placeholder="Nhập Họ và tên">
                <div th:if="${#fields.hasErrors('fullName')}" class="text-red-500 text-xs mt-1" th:errors="*{fullName}"></div>
            </div>

            <!-- Email -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" th:field="*{email}" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg input-field focus:outline-none transition"
                        placeholder="Nhập Email">
                <div th:if="${#fields.hasErrors('email')}" class="text-red-500 text-xs mt-1" th:errors="*{email}"></div>
            </div>

            <!-- Số điện thoại -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Số điện thoại</label>
                <input type="tel" th:field="*{phone}" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg input-field focus:outline-none transition"
                        placeholder="Nhập Số điện thoại">
                <div th:if="${#fields.hasErrors('phone')}" class="text-red-500 text-xs mt-1" th:errors="*{phone}"></div>
            </div>

            <!-- Giới tính -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Giới tính</label>
                <div class="flex space-x-8">
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" th:field="*{gender}" value="MALE" class="w-5 h-5 text-orange-500" checked>
                        <span class="ml-2 text-gray-700">Nam</span>
                    </label>
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" th:field="*{gender}" value="FEMALE" class="w-5 h-5 text-orange-500">
                        <span class="ml-2 text-gray-700">Nữ</span>
                    </label>
                </div>
                <div th:if="${#fields.hasErrors('gender')}" class="text-red-500 text-xs mt-1" th:errors="*{gender}"></div>
            </div>

            <!-- Ngày sinh -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ngày sinh</label>
                <input type="date" th:field="*{birthday}"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg input-field focus:outline-none transition">
            </div>

            <!-- Mật khẩu -->
            <div class="relative">
                <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
                <input type="password" th:field="*{password}" id="password" required
                        class="w-full px-4 py-3 pr-10 border border-gray-300 rounded-lg input-field focus:outline-none transition"
                        placeholder="Nhập Mật khẩu">
                <button type="button" onclick="togglePassword('password', this)"
                        class="absolute right-3 top-10 text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-eye"></i>
                </button>
                <div th:if="${#fields.hasErrors('password')}" class="text-red-500 text-xs mt-1" th:errors="*{password}"></div>
                <!-- Password requirements -->
                <div class="mt-2 text-xs text-gray-500">
                    <p class="font-medium mb-1">Yêu cầu mật khẩu:</p>
                    <ul class="list-disc list-inside space-y-0.5">
                        <li>Ít nhất 7 ký tự</li>
                        <li>Chứa ít nhất 1 chữ hoa (A-Z)</li>
                        <li>Chứa ít nhất 1 chữ thường (a-z)</li>
                        <li>Chứa ít nhất 1 số (0-9)</li>
                        <li>Chứa ít nhất 1 ký tự đặc biệt (!@#$%^&*...)</li>
                    </ul>
                </div>
            </div>

          <!-- Nhập lại mật khẩu -->
          <div class="relative">
            <label class="block text-sm font-medium text-gray-700 mb-1">Nhập lại mật khẩu</label>
            <input type="password" th:field="*{confirmPassword}" id="confirmPassword" required
                    class="w-full px-4 py-3 pr-10 border border-gray-300 rounded-lg input-field focus:outline-none transition"
                    placeholder="Nhập lại mật khẩu">
            <button type="button" onclick="togglePassword('confirmPassword', this)"
                    class="absolute right-3 top-10 text-gray-400 hover:text-gray-600">
              <i class="fa-solid fa-eye"></i>
            </button>
            <div th:if="${#fields.hasErrors('confirmPassword')}" class="text-red-500 text-xs mt-1" th:errors="*{confirmPassword}"></div>
          </div>

          <!-- Checkbox điều khoản -->
          <div class="flex items-start space-x-2">
            <input type="checkbox" id="terms" required
                   class="w-5 h-5 text-orange-500 border-gray-300 rounded focus:ring-orange-500 mt-0.5">
            <label for="terms" class="text-sm text-gray-600">
              Bằng việc đăng ký tài khoản, tôi đồng ý với
              <a href="#" class="text-blue-600 hover:underline">Điều khoản dịch vụ</a>
              và
              <a href="#" class="text-blue-600 hover:underline">Chính sách bảo mật</a>
              của Galaxy Cinema.
            </label>
          </div>

          <!-- Nút hoàn thành -->
          <button type="submit"
                  class="w-full btn-primary text-white font-semibold py-4 rounded-lg hover:shadow-lg transition mt-4">
            HOÀN THÀNH
          </button>

        </form>

        <!-- Link đăng nhập -->
        <div class="mt-6 pt-6 border-t border-gray-200 text-center">
          <p class="text-gray-600">Bạn đã có tài khoản?</p>
          <a th:href="@{/dang-nhap}" class="inline-block w-full mt-2 py-3 border-2 border-orange-500 text-orange-500 font-semibold rounded-lg hover:bg-orange-50 transition">
            Đăng nhập
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    function togglePassword(inputId, button) {
      const input = document.getElementById(inputId);
      const icon = button.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }
  </script>
</body>
</html>
