<main class="main" th:fragment="main">
    <div th:replace="~{fragments/admin-page-title :: adminPageTitle('Phòng chiếu & Sơ đồ ghế', 'Quản lý rạp', @{/admin})}"></div>
    <section class="section">
        <div class="row">
            <div class="col-lg-5">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Phòng chiếu (Rooms)</h5>
                        <table class="table table-sm table-striped">
                            <thead><tr><th>ID</th><th>Phòng</th><th>Rạp</th><th>Tổng ghế</th></tr></thead>
                            <tbody>
                            <tr th:each="r : ${items}">
                                <td th:text="${r.roomId}">1</td>
                                <td th:text="${r.name}">R1</td>
                                <td th:text="${r.cinema.name}">Rạp</td>
                                <td th:text="${r.totalSeats}">100</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="card">
                    <div class="card-body table-responsive">
                        <h5 class="card-title">Ghế (Seats)</h5>
                        <p class="text-muted small">Hàng A,B,C... — Loại Standard / VIP / Sweetbox.</p>
                        <table class="table table-sm table-striped">
                            <thead><tr><th>ID</th><th>Phòng ID</th><th>Hàng</th><th>Số</th><th>Loại</th></tr></thead>
                            <tbody>
                            <tr th:each="s : ${seats}">
                                <td th:text="${s.seatId}">1</td>
                                <td th:text="${s.room.roomId}">1</td>
                                <td th:text="${s.rowChar}">A</td>
                                <td th:text="${s.seatNumber}">1</td>
                                <td th:text="${s.seatType}">Standard</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
