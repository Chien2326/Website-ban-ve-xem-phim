<main id="main" class="main" th:fragment="main">
    <div th:replace="~{fragments/admin-page-title :: adminPageTitle('Phòng chiếu & Sơ đồ ghế', 'Quản lý rạp', @{/admin})}"></div>
    <section class="section">
        <div class="row">
            <div class="col-lg-5">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title mb-0">Phòng chiếu (Rooms)</h5>
                            <a th:href="@{/admin/rooms/new}" class="btn btn-primary btn-sm">Thêm phòng</a>
                        </div>
                        <table class="table table-sm table-striped">
                            <thead><tr><th>ID</th><th>Phòng</th><th>Rạp</th><th>Tổng ghế</th><th>Hành động</th></tr></thead>
                            <tbody>
                            <tr th:each="r : ${items}">
                                <td th:text="${r.roomId}">1</td>
                                <td th:text="${r.name}">R1</td>
                                <td th:text="${r.cinema.name}">Rạp</td>
                                <td th:text="${r.totalSeats}">100</td>
                                <td>
                                    <a th:href="@{/admin/rooms/{id}/edit(id=${r.roomId})}" class="btn btn-sm btn-outline-primary" title="Sửa"><i class="bi bi-pencil-square"></i></a>
                                    <form th:action="@{/admin/rooms/{id}/delete(id=${r.roomId})}" method="post" style="display:inline;">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa" onclick="return confirm('Bạn có chắc muốn xóa phòng này?')"><i class="bi bi-trash"></i></button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="card">
                    <div class="card-body table-responsive">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title mb-0">Ghế (Seats)</h5>
                            <a th:href="@{/admin/seats/new}" class="btn btn-primary btn-sm">Thêm ghế</a>
                        </div>
                        <p class="text-muted small">Hàng A,B,C... — Loại Standard / VIP / Sweetbox.</p>
                        <table class="table table-sm table-striped">
                            <thead><tr><th>ID</th><th>Phòng ID</th><th>Hàng</th><th>Số</th><th>Loại</th><th>Hành động</th></tr></thead>
                            <tbody>
                            <tr th:each="s : ${seats}">
                                <td th:text="${s.seatId}">1</td>
                                <td th:text="${s.room.roomId}">1</td>
                                <td th:text="${s.rowChar}">A</td>
                                <td th:text="${s.seatNumber}">1</td>
                                <td>
                                    <span th:if="${s.seatType.name() == 'Standard'}" class="badge bg-secondary" th:text="${s.seatType}">Standard</span>
                                    <span th:if="${s.seatType.name() == 'VIP'}" class="badge bg-warning text-dark" th:text="${s.seatType}">VIP</span>
                                    <span th:if="${s.seatType.name() == 'Sweetbox'}" class="badge bg-danger" th:text="${s.seatType}">Sweetbox</span>
                                </td>
                                <td>
                                    <a th:href="@{/admin/seats/{id}/edit(id=${s.seatId})}" class="btn btn-sm btn-outline-primary" title="Sửa"><i class="bi bi-pencil-square"></i></a>
                                    <form th:action="@{/admin/seats/{id}/delete(id=${s.seatId})}" method="post" style="display:inline;">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa" onclick="return confirm('Bạn có chắc muốn xóa ghế này?')"><i class="bi bi-trash"></i></button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
