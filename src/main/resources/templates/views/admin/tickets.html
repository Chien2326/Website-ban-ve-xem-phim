<main id="main" class="main" th:fragment="main">
    <div th:replace="~{fragments/admin-page-title :: adminPageTitle('Tra cứu vé lẻ', 'Quản lý đơn hàng', @{/admin})}"></div>
    <section class="section">
        <div class="card">
            <div class="card-body table-responsive">
                <h5 class="card-title">Ticket_Details</h5>
                <p class="text-muted small">Chi tiết ghế trong đơn: mã vé, đơn hàng, ghế, giá thực tế (price_actual).</p>
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>Mã vé</th><th>Đơn</th><th>Phim</th><th>Ghế</th><th>Giá vé</th><th>Khách</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="t : ${items}">
                        <td th:text="${t.ticketId}">1</td>
                        <td th:text="${'#' + t.booking.bookingId}">#1</td>
                        <td th:text="${t.showSeat.showtime.movie.title}">Phim</td>
                        <td th:text="${t.showSeat.seat.rowChar + t.showSeat.seat.seatNumber}">A1</td>
                        <td th:text="${#numbers.formatDecimal(t.priceActual, 0, 'COMMA', 0, 'POINT')} + ' đ'">0</td>
                        <td th:text="${t.booking.user.fullName}">Khách</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
