<main id="main" class="main" th:fragment="main">
    <div th:replace="~{fragments/admin-page-title :: adminPageTitle('Tra cứu vé lẻ', 'Quản lý đơn hàng', @{/admin})}"></div>

    <section class="section">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4">

                <div class="mb-3">
                    <h5 class="card-title mb-1 fw-bold text-secondary text-uppercase" style="font-size: 0.95rem; letter-spacing: 0.5px;">
                        <i class="bi bi-ticket-perforated me-2 text-primary"></i>Danh sách vé chi tiết (Ticket Details)
                    </h5>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 datatable">
                        <thead class="table-light text-secondary small">
                        <tr>
                            <th class="py-3" style="width: 10%;">Mã vé</th>
                            <th class="py-3" style="width: 12%;">Mã đơn</th>
                            <th class="py-3" style="width: 28%;">Tên phim</th>
                            <th class="py-3" style="width: 12%;">Vị trí ghế</th>
                            <th class="py-3" style="width: 15%;">Giá vé thực tế</th>
                            <th class="py-3" style="width: 23%;">Khách hàng sở hữu</th>
                        </tr>
                        </thead>
                        <tbody class="small">
                        <tr th:each="t : ${items}">
                            <td class="fw-semibold text-muted" th:text="${t.ticketId}">1</td>
                            <td>
                                <span class="badge bg-dark-subtle text-dark font-monospace px-2 py-1" th:text="${'#' + t.booking.bookingId}">#1</span>
                            </td>
                            <td class="fw-bold text-dark" th:text="${t.showSeat.showtime.movie.title}">Phim</td>
                            <td>
                                    <span class="badge bg-light text-primary border border-primary-subtle fw-bold px-2 py-1"
                                          th:text="${t.showSeat.seat.rowChar + t.showSeat.seat.seatNumber}">A1</span>
                            </td>
                            <td class="fw-bold text-dark" th:text="${#numbers.formatDecimal(t.priceActual, 0, 'COMMA', 0, 'POINT')} + ' đ'">0</td>
                            <td class="fw-medium text-secondary" th:text="${t.booking.user.fullName}">Khách</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(items)}">
                            <td colspan="6" class="text-center py-5 text-muted">
                                <i class="bi bi-ticket-detailed display-6 d-block mb-2 text-black-50"></i>
                                <span>Hệ thống chưa phát hành vé lẻ nào</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </section>
</main>
