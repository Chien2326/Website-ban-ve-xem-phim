<main id="main" class="main" th:fragment="main">
    <div th:replace="~{fragments/admin-page-title :: adminPageTitle('Lịch chiếu', 'Quản lý phim', @{/admin})}"></div>
    <section class="section">
        <div class="d-flex justify-content-end mb-3">
            <a th:href="@{/admin/showtimes/new}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg"></i> Thêm suất chiếu
            </a>
        </div>
        <div class="card">
            <div class="card-body table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                    <tr>
                        <th>ID</th><th>Phim</th><th>Rạp / Phòng</th><th>Bắt đầu</th>
                        <th>Định dạng</th><th>Giá gốc</th><th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="st : ${items}">
                        <td th:text="${st.showtimeId}">1</td>
                        <td th:text="${st.movie.title}">Phim</td>
                        <td>
                            <span th:text="${st.room.cinema.name}">Rạp</span> /
                            <span th:text="${st.room.name}">Phòng</span>
                        </td>
                        <td th:text="${#temporals.format(st.startTime, 'dd/MM/yyyy HH:mm')}">—</td>
                        <td th:text="${st.formatType}">2D</td>
                        <td th:text="${#numbers.formatDecimal(st.priceBase, 0, 'COMMA', 0, 'POINT')} + ' đ'">0</td>
                        <td class="text-nowrap">
                            <a th:href="@{/admin/showtimes/{id}/seats(id=${st.showtimeId})}"
                               class="btn btn-outline-info btn-sm" title="Giám sát ghế"><i class="bi bi-eye"></i></a>
                            <a th:href="@{/admin/showtimes/{id}/edit(id=${st.showtimeId})}"
                               class="btn btn-outline-primary btn-sm" title="Sửa"><i class="bi bi-pencil-square"></i></a>
                            <form th:action="@{/admin/showtimes/{id}/delete(id=${st.showtimeId})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Xóa suất chiếu này?');">
                                <button type="submit" class="btn btn-outline-danger btn-sm" title="Xóa"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(items)}">
                        <td colspan="7" class="text-center text-muted">Chưa có suất chiếu</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
