<main id="main" class="main" th:fragment="main">
    <div th:with="pageTitle=${form.regionId != null ? 'Sửa khu vực' : 'Thêm khu vực mới'}"
         th:replace="~{fragments/admin-page-title :: adminPageTitle(${pageTitle}, 'Danh sách khu vực', @{/admin/regions})}"></div>
    <section class="section">
        <div class="card">
            <div class="card-body">
                <form th:action="@{/admin/regions/save}" method="post" th:object="${form}">
                    <input type="hidden" th:field="*{regionId}">
                    <div class="row g-3">
                        <div class="col-md-12">
                            <label class="form-label">Tên khu vực *</label>
                            <input type="text" class="form-control" th:field="*{regionName}" required>
                        </div>
                    </div>
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Lưu khu vực</button>
                        <a th:href="@{/admin/regions}" class="btn btn-secondary">Hủy</a>
                    </div>
                </form>
            </div>
        </div>
    </section>
</main>
