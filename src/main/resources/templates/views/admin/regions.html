<main id="main" class="main" th:fragment="main">
    <div th:replace="~{fragments/admin-page-title :: adminPageTitle('Tỉnh / Thành phố', 'Quản lý rạp', @{/admin})}"></div>
    <section class="section">
        <div class="card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="card-title mb-0">Danh sách khu vực</h5>
                    <a th:href="@{/admin/regions/new}" class="btn btn-primary">Thêm khu vực</a>
                </div>
                <table class="table table-striped">
                    <thead><tr><th>ID</th><th>Khu vực</th><th>Hành động</th></tr></thead>
                    <tbody>
                    <tr th:each="r : ${items}">
                        <td th:text="${r.regionId}">1</td>
                        <td th:text="${r.regionName}">Hà Nội</td>
                        <td>
                            <a th:href="@{/admin/regions/{id}/edit(id=${r.regionId})}" class="btn btn-sm btn-outline-primary" title="Sửa"><i class="bi bi-pencil-square"></i></a>
                            <form th:action="@{/admin/regions/{id}/delete(id=${r.regionId})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa" onclick="return confirm('Bạn có chắc muốn xóa khu vực này?')"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
