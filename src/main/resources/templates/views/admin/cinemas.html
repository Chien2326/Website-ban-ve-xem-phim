<main id="main" class="main" th:fragment="main">
    <div th:replace="~{fragments/admin-page-title :: adminPageTitle('Danh sách rạp', 'Quản lý rạp', @{/admin})}"></div>

    <section class="section">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="card-title mb-0 fw-bold text-secondary text-uppercase" style="font-size: 1.1rem; letter-spacing: 0.5px;">
                        Danh sách cụm rạp
                    </h5>
                    <a th:href="@{/admin/cinemas/new}" class="btn btn-primary px-3 py-2 rounded-2 d-flex align-items-center gap-2 shadow-sm">
                        <i class="bi bi-plus-lg fs-6"></i>
                        <span>Thêm rạp mới</span>
                    </a>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 datatable">
                        <thead class="table-light text-secondary">
                        <tr>
                            <th class="py-3" style="width: 8%;">ID</th>
                            <th class="py-3" style="width: 25%;">Tên rạp</th>
                            <th class="py-3" style="width: 15%;">Khu vực</th>
                            <th class="py-3" style="width: 37%;">Địa chỉ</th>
                            <th class="py-3 text-end pe-4" style="width: 15%;" data-sortable="false">Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="c : ${items}">
                            <td class="fw-semibold text-muted" th:text="${c.cinemaId}">1</td>
                            <td class="fw-bold text-dark" th:text="${c.name}">Galaxy</td>
                            <td>
                                <span class="badge bg-light text-secondary border px-2 py-1" th:text="${c.region.regionName}">Hà Nội</span>
                            </td>
                            <td class="text-muted">
                                <small><i class="bi bi-geo-alt me-1 text-danger-subtle"></i><span th:text="${c.address}">Địa chỉ</span></small>
                            </td>
                            <td class="text-end pe-4">
                                <div class="d-inline-flex gap-2">
                                    <a th:href="@{/admin/cinemas/{id}/edit(id=${c.cinemaId})}"
                                       class="btn btn-sm btn-light text-primary border rounded-circle d-flex align-items-center justify-content-center"
                                       style="width: 32px; height: 32px;"
                                       title="Sửa">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    <form th:action="@{/admin/cinemas/{id}/delete(id=${c.cinemaId})}" method="post" style="display:inline;">
                                        <button type="submit"
                                                class="btn btn-sm btn-light text-danger border rounded-circle d-flex align-items-center justify-content-center"
                                                style="width: 32px; height: 32px;"
                                                title="Xóa"
                                                onclick="return confirm('Bạn có chắc muốn xóa rạp này?')">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(items)}">
                            <td colspan="5" class="text-center py-5 text-muted">
                                <i class="bi bi-building-x display-6 d-block mb-2 text-black-50"></i>
                                <span>Chưa có cụm rạp nào trong danh sách</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </section>
</main>
