<main id="main" class="main" th:fragment="main">
    <div th:with="pageTitle=${form.movieId != null ? 'Sửa phim' : 'Thêm phim mới'}"
         th:replace="~{fragments/admin-page-title :: adminPageTitle(${pageTitle}, 'Danh sách phim', @{/admin/movies})}"></div>
    <section class="section">
        <div class="card">
            <div class="card-body">
                <form th:action="@{/admin/movies/save}" method="post" th:object="${form}">
                    <input type="hidden" th:field="*{movieId}">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label">Tên phim *</label>
                            <input type="text" class="form-control" th:field="*{title}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Thời lượng (phút) *</label>
                            <input type="number" class="form-control" th:field="*{duration}" min="1" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Mô tả</label>
                            <textarea class="form-control" rows="4" th:field="*{description}"></textarea>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Ngày công chiếu</label>
                            <input type="date" class="form-control" th:field="*{releaseDate}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Trạng thái</label>
                            <select class="form-select" th:field="*{status}">
                                <option th:each="s : ${movieStatuses}" th:value="${s}" th:text="${s}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Độ tuổi</label>
                            <select class="form-select" th:field="*{rating}">
                                <option value="">—</option>
                                <option th:each="r : ${ageRatings}" th:value="${r}" th:text="${r}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Poster URL</label>
                            <input type="url" class="form-control" th:field="*{posterUrl}" placeholder="https://...">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Trailer URL</label>
                            <input type="url" class="form-control" th:field="*{trailerUrl}" placeholder="https://youtube.com/...">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Điểm đánh giá (sao)</label>
                            <input type="number" step="0.1" min="0" max="10" class="form-control" th:field="*{star}">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Thể loại</label>
                            <div class="d-flex flex-wrap gap-3">
                                <div th:each="g : ${genres}" class="form-check">
                                    <input class="form-check-input" type="checkbox"
                                           name="genreIds" th:value="${g.genreId}"
                                           th:id="${'genre-' + g.genreId}"
                                           th:checked="${form.genreIds != null and form.genreIds.contains(g.genreId)}">
                                    <label class="form-check-label" th:for="${'genre-' + g.genreId}" th:text="${g.genreName}">Hành động</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Lưu phim</button>
                        <a th:href="@{/admin/movies}" class="btn btn-secondary">Hủy</a>
                    </div>
                </form>
            </div>
        </div>
    </section>
</main>
