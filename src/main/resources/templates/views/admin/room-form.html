<main id="main" class="main" th:fragment="main">
    <div th:with="pageTitle=${form.roomId != null ? 'Sửa phòng' : 'Thêm phòng mới'}"
         th:replace="~{fragments/admin-page-title :: adminPageTitle(${pageTitle}, 'Danh sách phòng', @{/admin/rooms})}"></div>
    <section class="section">
        <div class="card">
            <div class="card-body">
                <form th:action="@{/admin/rooms/save}" method="post" th:object="${form}">
                    <input type="hidden" th:field="*{roomId}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Rạp *</label>
                            <select class="form-select" th:field="*{cinemaId}" required>
                                <option value="">Chọn rạp</option>
                                <option th:each="c : ${cinemas}" th:value="${c.cinemaId}" th:text="${c.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Tên phòng *</label>
                            <input type="text" class="form-control" th:field="*{name}" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Tổng ghế *</label>
                            <input type="number" class="form-control" th:field="*{totalSeats}" min="1" required>
                        </div>
                    </div>
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Lưu phòng</button>
                        <a th:href="@{/admin/rooms}" class="btn btn-secondary">Hủy</a>
                    </div>
                </form>
            </div>
        </div>
    </section>
</main>
