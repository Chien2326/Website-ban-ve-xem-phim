<main class="main" th:fragment="main">
    <div th:replace="~{fragments/admin-page-title :: adminPageTitle('Thể loại phim', 'Quản lý phim', @{/admin})}"></div>
    <section class="section">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Danh mục Genres</h5>
                <p class="text-muted small">Quản lý thể loại phim (Hành động, Tình cảm, Kinh dị...). Gán phim qua bảng MovieGenres.</p>
                <table class="table table-striped datatable">
                    <thead>
                    <tr><th>ID</th><th>Tên thể loại</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="g : ${items}">
                        <td th:text="${g.genreId}">1</td>
                        <td th:text="${g.genreName}">Hành động</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(items)}">
                        <td colspan="2" class="text-center text-muted">Chưa có thể loại</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
