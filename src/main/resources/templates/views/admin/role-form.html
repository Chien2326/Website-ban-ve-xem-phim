<main id="main" class="main" th:fragment="main">
    <div th:with="pageTitle=${form.roleId != null ? 'Sửa vai trò' : 'Thêm vai trò mới'}"
         th:replace="~{fragments/admin-page-title :: adminPageTitle(${pageTitle}, 'Danh sách vai trò', @{/admin/roles})}"></div>

    <section class="section">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-7">

                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4">

                        <h5 class="card-title mb-4 fw-bold text-secondary text-uppercase" style="font-size: 1rem; letter-spacing: 0.5px;">
                            Thông tin cấu hình vai trò
                        </h5>

                        <form th:action="@{/admin/roles/save}" method="post" th:object="${form}">
                            <input type="hidden" th:field="*{roleId}">

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold text-secondary small">
                                        Tên vai trò <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" class="form-control py-2 rounded-2"
                                           th:field="*{roleName}"
                                           placeholder="Ví dụ: ADMIN, STAFF, MANAGER..."
                                           pattern="^[A-Za-zÀ-žĐđ ]+$"
                                           title="Tên vai trò chỉ được chứa chữ và khoảng trắng"
                                           maxlength="50"
                                           required>
                                </div>

                                <div class="col-md-12">
                                    <label class="form-label fw-semibold text-secondary small">
                                        Mô tả quyền hạn
                                    </label>
                                    <textarea class="form-control rounded-2 p-3" rows="3"
                                              th:field="*{description}"
                                              placeholder="Nhập mô tả tóm tắt về phạm vi truy cập module của vai trò này..."></textarea>
                                </div>
                            </div>

                            <div class="mt-4 pt-2 d-flex gap-2">
                                <button type="submit" class="btn btn-primary px-4 py-2 rounded-2 d-flex align-items-center gap-2 shadow-sm">
                                    <i class="bi bi-check-lg fs-5"></i>
                                    <span>Lưu vai trò</span>
                                </button>
                                <a th:href="@{/admin/roles}" class="btn btn-light text-secondary border px-4 py-2 rounded-2 d-flex align-items-center gap-2">
                                    <i class="bi bi-x-lg"></i>
                                    <span>Hủy</span>
                                </a>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </section>
</main>
