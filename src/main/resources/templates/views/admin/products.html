<main id="main" class="main" th:fragment="main">
    <div th:replace="~{fragments/admin-page-title :: adminPageTitle('Combo / Đồ ăn', 'Bắp nước', @{/admin})}"></div>
    <section class="section">
        <div class="card mb-3">
            <div class="card-body table-responsive">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="card-title mb-0">Danh mục Products</h5>
                    <a th:href="@{/admin/products/new}" class="btn btn-primary">Thêm sản phẩm</a>
                </div>
                <table class="table table-striped">
                    <thead>
                    <tr><th>ID</th><th>Tên</th><th>Loại</th><th>Giá</th><th>Trạng thái</th><th>Hành động</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${items}">
                        <td th:text="${p.productId}">1</td>
                        <td th:text="${p.productName}">Combo</td>
                        <td>
                            <span th:if="${p.productType.name() == 'COMBO'}" class="badge bg-primary" th:text="${p.productType}">COMBO</span>
                            <span th:if="${p.productType.name() == 'FOOD'}" class="badge bg-warning text-dark" th:text="${p.productType}">FOOD</span>
                            <span th:if="${p.productType.name() == 'DRINK'}" class="badge bg-info" th:text="${p.productType}">DRINK</span>
                        </td>
                        <td th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">0</td>
                        <td>
                            <span th:if="${p.status.name() == 'AVAILABLE'}" class="badge bg-success" th:text="${p.status}">AVAILABLE</span>
                            <span th:if="${p.status.name() == 'UNAVAILABLE'}" class="badge bg-danger" th:text="${p.status}">UNAVAILABLE</span>
                        </td>
                        <td>
                            <a th:href="@{/admin/products/{id}/edit(id=${p.productId})}" class="btn btn-sm btn-outline-primary" title="Sửa"><i class="bi bi-pencil-square"></i></a>
                            <form th:action="@{/admin/products/{id}/delete(id=${p.productId})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa" onclick="return confirm('Bạn có chắc muốn xóa sản phẩm này?')"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card">
            <div class="card-body table-responsive">
                <h5 class="card-title">Thống kê tiêu thụ (BookingProducts)</h5>
                <table class="table table-sm table-striped">
                    <thead>
                    <tr><th>ID</th><th>Đơn</th><th>Sản phẩm</th><th>SL</th><th>Đơn giá</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="bp : ${bookingProducts}">
                        <td th:text="${bp.bookingProductId}">1</td>
                        <td th:text="${'#' + bp.booking.bookingId}">#1</td>
                        <td th:text="${bp.product.productName}">Bắp</td>
                        <td th:text="${bp.quantity}">1</td>
                        <td th:text="${#numbers.formatDecimal(bp.unitPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">0</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(bookingProducts)}">
                        <td colspan="5" class="text-muted text-center">Chưa có giao dịch sản phẩm</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
