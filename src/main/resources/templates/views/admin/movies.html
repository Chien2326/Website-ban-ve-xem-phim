<main class="main" th:fragment="main">
    <div th:replace="~{fragments/admin-page-title :: adminPageTitle('Danh sách phim', 'Quản lý phim', @{/admin})}"></div>
    <section class="section">
        <div class="card">
            <div class="card-body table-responsive">
                <h5 class="card-title">Movies</h5>
                <p class="text-muted small">Poster, trailer, thời lượng, độ tuổi (P/T13/T16/T18), trạng thái COMING_SOON / NOW_SHOWING / ENDED.</p>
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>ID</th><th>Tên phim</th><th>Thời lượng</th><th>Độ tuổi</th><th>Trạng thái</th><th>Đánh giá</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="m : ${items}">
                        <td th:text="${m.movieId}">1</td>
                        <td th:text="${m.title}">Phim</td>
                        <td th:text="${m.duration} + ' phút'">120 phút</td>
                        <td th:text="${m.rating}">T16</td>
                        <td><span class="badge bg-info" th:text="${m.status}">NOW_SHOWING</span></td>
                        <td th:text="${m.star}">8.5</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
