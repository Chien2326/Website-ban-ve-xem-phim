<main id="main" class="main" th:fragment="main">
    <div th:replace="~{fragments/admin-page-title :: adminPageTitle('Danh sách phim', 'Quản lý phim', @{/admin})}"></div>
    <section class="section">
        <div class="d-flex justify-content-end mb-3">
            <a th:href="@{/admin/movies/new}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg"></i> Thêm phim
            </a>
        </div>
        <div class="card">
            <div class="card-body table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                    <tr>
                        <th>ID</th><th>Tên phim</th><th>Thời lượng</th><th>Độ tuổi</th>
                        <th>Trạng thái</th><th>Đánh giá</th><th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="m : ${items}">
                        <td th:text="${m.movieId}">1</td>
                        <td th:text="${m.title}">Phim</td>
                        <td th:text="${m.duration} + ' phút'">120</td>
                        <td th:text="${m.rating}">T16</td>
                        <td>
                            <span th:if="${m.status.name() == 'NOW_SHOWING'}" class="badge bg-success" th:text="${m.status}">NOW_SHOWING</span>
                            <span th:if="${m.status.name() == 'COMING_SOON'}" class="badge bg-info" th:text="${m.status}">COMING_SOON</span>
                            <span th:if="${m.status.name() == 'ENDED'}" class="badge bg-secondary" th:text="${m.status}">ENDED</span>
                        </td>
                        <td th:text="${m.star}">8.5</td>
                        <td class="text-nowrap">
                            <a th:href="@{/admin/movies/{id}/edit(id=${m.movieId})}" class="btn btn-outline-primary btn-sm" title="Sửa"><i class="bi bi-pencil-square"></i></a>
                            <form th:action="@{/admin/movies/{id}/delete(id=${m.movieId})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Xóa phim này?');">
                                <button type="submit" class="btn btn-outline-danger btn-sm" title="Xóa"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(items)}">
                        <td colspan="7" class="text-center text-muted">Chưa có phim</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
