<main id="main" class="main" th:fragment="main">
    <div th:with="pageTitle=${form.cinemaId != null ? 'Sửa rạp' : 'Thêm rạp mới'}"
         th:replace="~{fragments/admin-page-title :: adminPageTitle(${pageTitle}, 'Danh sách rạp', @{/admin/cinemas})}"></div>
    <section class="section">
        <div class="card">
            <div class="card-body">
                <form th:action="@{/admin/cinemas/save}" method="post" th:object="${form}">
                    <input type="hidden" th:field="*{cinemaId}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Khu vực *</label>
                            <select class="form-select" th:field="*{regionId}" required>
                                <option value="">Chọn khu vực</option>
                                <option th:each="r : ${regions}" th:value="${r.regionId}" th:text="${r.regionName}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Tên rạp *</label>
                            <input type="text" class="form-control" th:field="*{name}" required>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Địa chỉ *</label>
                            <textarea class="form-control" rows="3" th:field="*{address}" required></textarea>
                        </div>
                    </div>
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Lưu rạp</button>
                        <a th:href="@{/admin/cinemas}" class="btn btn-secondary">Hủy</a>
                    </div>
                </form>
            </div>
        </div>
    </section>
</main>
