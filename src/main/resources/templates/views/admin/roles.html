<main id="main" class="main" th:fragment="main">
    <div th:replace="~{fragments/admin-page-title :: adminPageTitle('Phân quyền', 'Hệ thống', @{/admin})}"></div>

    <section class="section">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4">

                <div class="d-flex justify-content-between align-items-center mb-1">
                    <h5 class="card-title mb-0 fw-bold text-secondary text-uppercase" style="font-size: 1.1rem; letter-spacing: 0.5px;">
                        Danh sách vai trò
                    </h5>
                    <a th:href="@{/admin/roles/new}" class="btn btn-primary px-3 py-2 rounded-2 d-flex align-items-center gap-2 shadow-sm">
                        <i class="bi bi-plus-lg fs-6"></i>
                        <span>Thêm vai trò</span>
                    </a>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 datatable">
                        <thead class="table-light text-secondary">
                        <tr>
                            <th class="py-3" style="width: 10%;">ID</th>
                            <th class="py-3" style="width: 20%;">Tên vai trò</th>
                            <th class="py-3" style="width: 55%;">Mô tả quyền hạn</th>
                            <th class="py-3 text-end pe-4" style="width: 15%;" data-sortable="false">Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="r : ${items}">
                            <td class="fw-semibold text-muted" th:text="${r.roleId}">1</td>
                            <td>
                                <span th:if="${r.roleName == 'ADMIN'}" class="badge bg-danger-subtle text-danger border border-danger-subtle px-2 py-1.5 fw-bold" th:text="${r.roleName}">ADMIN</span>
                                <span th:if="${r.roleName == 'STAFF'}" class="badge bg-warning-subtle text-warning border border-warning-subtle px-2 py-1.5 fw-bold" th:text="${r.roleName}">STAFF</span>
                                <span th:if="${r.roleName == 'CUSTOMER'}" class="badge bg-secondary-subtle text-secondary border border-secondary-subtle px-2 py-1.5 fw-bold" th:text="${r.roleName}">CUSTOMER</span>
                                <span th:if="${r.roleName != 'ADMIN' and r.roleName != 'STAFF' and r.roleName != 'CUSTOMER'}" class="badge bg-light text-dark border px-2 py-1.5" th:text="${r.roleName}">ROLE</span>
                            </td>
                            <td class="text-secondary fw-medium" th:text="${r.description}">Mô tả</td>
                            <td class="text-end pe-4">
                                <div class="d-inline-flex gap-2">
                                    <a th:href="@{/admin/roles/{id}/edit(id=${r.roleId})}"
                                       class="btn btn-sm btn-light text-primary border rounded-circle d-flex align-items-center justify-content-center"
                                       style="width: 32px; height: 32px;"
                                       title="Sửa">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    <form th:action="@{/admin/roles/{id}/delete(id=${r.roleId})}" method="post" style="display:inline;">
                                        <button type="submit"
                                                class="btn btn-sm btn-light text-danger border rounded-circle d-flex align-items-center justify-content-center"
                                                style="width: 32px; height: 32px;"
                                                title="Xóa"
                                                onclick="return confirm('Bạn có chắc muốn xóa vai trò này?')">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(items)}">
                            <td colspan="4" class="text-center py-5 text-muted">
                                <i class="bi bi-shield-slash display-6 d-block mb-2 text-black-50"></i>
                                <span>Chưa khởi tạo vai trò nào trên hệ thống</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </section>
</main>
