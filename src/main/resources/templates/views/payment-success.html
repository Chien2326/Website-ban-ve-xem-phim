<style>
    @media print {
        .no-print { display: none !important; }
        body { background: white !important; }
        .container { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
    }
</style>
<main class="container my-8" th:fragment="main" th:with="checkout=${checkout}, uniqueCode=${uniqueTicketCode}">
    <div class="max-w-4xl mx-auto px-4 py-6">

        <!-- Header with back button -->
        <div class="mb-6 no-print">
            <button onclick="location.href='/';" class="text-xl text-gray-700 mr-4 font-light flex items-center mb-3">
                &larr; Về trang chủ
            </button>
            <h1 class="text-2xl font-bold text-gray-800">Thông tin vé</h1>
        </div>

        <!-- Ticket Card -->
        <div id="invoice-element" class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">

            <div class="flex flex-col md:flex-row">

                <!-- Left: QR & Movie Info -->
                <div class="md:w-1/2 p-6 border-b md:border-r border-gray-100">
                    <!-- Movie Info Section -->
                    <div class="mb-6" th:if="${checkout != null}">
                        <div class="flex gap-4 items-start">
                            <!-- Poster -->
                            <img th:src="${checkout.posterUrl != null and !#strings.isEmpty(checkout.posterUrl) ? checkout.posterUrl : 'https://via.placeholder.com/140x210'}"
                                 class="w-32 h-48 object-cover rounded-xl shadow"
                                 th:alt="${checkout.movieTitle}">

                            <!-- Movie Details -->
                            <div class="flex-1">
                                <h2 class="text-2xl font-black text-gray-900 mb-1" th:text="${checkout.movieTitle}">Heo Năm Móng</h2>
                                <div class="text-gray-600 text-base mb-2" th:text="${checkout.formatType}">2D PHỤ ĐỀ</div>
                                <!-- Rating Badge -->
                                <div th:if="${checkout.rating != null}"
                                     th:class="'inline-block px-3 py-1 rounded-lg text-xs font-bold text-white ' + ${checkout.ratingBadgeClass}"
                                     th:text="${checkout.rating}">
                                    T18
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- QR Code Section -->
                    <div class="flex justify-center pt-2">
                        <div class="text-center bg-gray-50 p-6 rounded-xl border border-gray-200 w-full">
                            <img th:src="'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + ${uniqueCode}"
                                 alt="QR Code Vé"
                                 class="w-52 h-52 object-cover mx-auto">
                            <p class="text-lg font-black text-[#034ea1] mt-4 tracking-widest" th:text="${uniqueCode}">C9-ABCD1234</p>
                        </div>
                    </div>
                </div>

                <!-- Right: Details -->
                <div class="md:w-1/2 p-6">

                    <!-- Cinema & Showtime -->
                    <div class="mb-5 pb-5 border-b border-gray-200" th:if="${checkout != null}">
                        <h3 class="text-xl font-bold text-gray-800 mb-2"
                            th:text="${checkout.cinemaName + ' - ' + checkout.roomName}">
                            C9 Sala - Phòng 1
                        </h3>
                        <p class="text-gray-600 text-lg"
                           th:text="'Suất chiếu: ' + ${#temporals.format(checkout.startTime, 'HH:mm')} + ' - ' + ${#temporals.format(checkout.startTime, 'EEEE, dd/MM/yyyy', new java.util.Locale('vi', 'VN'))}">
                            Suất chiếu: 20:15 - Thứ 3, 03/06/2026
                        </p>
                    </div>

                    <!-- Seats Section -->
                    <div class="mb-5 pb-5 border-b border-gray-200" th:if="${checkout != null}">
                        <div class="flex justify-between items-center">
                            <span class="text-gray-700 font-semibold text-lg">Ghế</span>
                            <span class="text-gray-900 font-black text-xl" th:text="${checkout.seatLabels}">A12, B15</span>
                        </div>
                    </div>

                    <!-- Products Section -->
                    <div class="mb-5 pb-5 border-b border-gray-200" th:if="${checkout != null and !#lists.isEmpty(checkout.selectedProducts)}">
                        <h4 class="text-gray-700 font-semibold text-lg mb-3">Đồ ăn & nước</h4>
                        <div class="space-y-2">
                            <div th:each="product : ${checkout.selectedProducts}">
                                <span class="text-gray-700 font-semibold text-base"
                                      th:text="${product.quantity} + 'x ' + ${product.productName}">
                                    2x Bắp rang caramel
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- Footer Info -->
                    <div class="mb-7 pt-2">
                        <div class="grid grid-cols-3 gap-4 text-center">
                            <div class="bg-gray-50 p-3 rounded-xl border border-gray-200">
                                <p class="text-gray-500 text-xs mb-1">Mã vé</p>
                                <p class="font-bold text-gray-800 text-sm break-all" 
                                   th:text="${uniqueCode != null ? uniqueCode : (checkout != null ? 'TKT-' + checkout.showtimeId : '')}">C9-ABCD1234</p>
                            </div>
                            <div class="bg-gray-50 p-3 rounded-xl border border-gray-200">
                                <p class="text-gray-500 text-xs mb-1">Loại vé</p>
                                <p class="font-bold text-gray-800 text-base">Regular</p>
                            </div>
                            <div class="bg-orange-50 p-3 rounded-xl border border-orange-200">
                                <p class="text-gray-600 text-xs mb-1">Thanh toán</p>
                                <p class="font-bold text-orange-500 text-lg break-all"
                                   th:if="${checkout != null}"
                                   th:text="${#numbers.formatDecimal(checkout.grandTotal, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">
                                    364.000 VNĐ
                                </p>
                            </div>
                        </div>
                    </div>

                    <!-- Buttons -->
                    <div class="space-y-3 no-print">
                        <button onclick="downloadInvoice()" class="w-full py-3 border-2 border-orange-500 text-orange-500 font-bold text-lg rounded-xl hover:bg-orange-50 transition">
                            Tải Hóa Đơn PDF
                        </button>
                        <button onclick="location.href='/';" class="w-full py-3 bg-orange-500 text-white font-bold text-lg rounded-xl hover:bg-orange-600 transition shadow-lg">
                            Đóng
                        </button>
                    </div>

                </div>

            </div>

        </div>

    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        function downloadInvoice() {
            const element = document.getElementById('invoice-element');
            const opt = {
                margin: 10,
                filename: 'Hoa-Don-C9-Cinema.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }
    </script>
</main>
