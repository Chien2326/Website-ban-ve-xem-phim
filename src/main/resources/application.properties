spring.application.name=HeThongWebBanVeXemPhim

# MariaDB / MySQL (HeidiSQL) - database banvexemphim trong docs/database
spring.datasource.url=jdbc:mariadb://localhost:3306/banvexemphim?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Schema đã tạo sẵn trong HeidiSQL: chỉ kiểm tra ánh xạ, không tự sửa bảng
spring.jpa.hibernate.ddl-auto=validate
# schema.sql chạy TRƯỚC Hibernate (mặc định) — tạo tblMenu nếu thiếu
spring.sql.init.mode=always
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Giữ đúng tên bảng/cột như script SQL (tblMenu, Roles, Ticket_Details...) — không đổi sang snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

